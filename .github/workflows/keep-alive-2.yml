name: keep-alive-2

# زيارة إضافية بإزاحة دقيقتين لتقليص فترات نوم السيرفر
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://ps5-news-bot.onrender.com/ping)
          echo "HTTP $code"
